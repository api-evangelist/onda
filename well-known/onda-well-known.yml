method: probed
source: direct HTTPS probes of every /.well-known/ path on the only host Onda owns
note: >-
  Onda is a canned-tequila CPG brand with no API and no developer program, so there is exactly one
  host in scope: its own storefront, drinkonda.com. Every /.well-known/ path was probed on
  2026-08-26 and every one returned 404. The origin is a Shopify store that is currently
  UNAVAILABLE — the site root itself returns HTTP 404 with the body "This store is unavailable" —
  so these are not "provider chose not to publish discovery documents" 404s so much as "the whole
  storefront is 404ing" 404s. Either way nothing was served and nothing was saved.
  NO WellKnown AND NO SecurityTxt POINTER IS EMITTED: hit_count is 0, and a pointer would assert
  that Onda serves a discovery surface it does not.
  Two non-.well-known documents DID return 200 and are recorded below for completeness; neither is
  a discovery document and neither earns a pointer. /robots.txt is Shopify's default and disallows
  all crawling. /llms.txt is a Shopify platform-generated placeholder whose entire content is
  "This store is currently unavailable. Agent interaction is not possible at this time." — it is a
  tombstone that disclaims an agent surface rather than describing one, so wiring type LLMsTxt to
  it would credit Onda with an agent-facing document the document itself says does not exist.
hit_count: 0
