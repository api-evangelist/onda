aid: onda
name: Onda
description: >-
  Onda is a ready-to-drink spirits brand that makes canned sparkling tequila — blanco tequila from a
  woman-owned distillery in Jalisco, Mexico, blended with sparkling water and real fruit juice and
  sold in 12 oz cans at 5% ABV, 100 calories, zero sugar and naturally gluten free, in lime, blood
  orange, watermelon and grapefruit. The company was founded in 2019 and launched publicly in July
  2020 by Noah Gray (CEO), Max Dworin (COO), Kelli Adams (CCO) and actor-producer Shay Mitchell
  (Chief Brand Officer). It raised a $5M Series A in 2021 and a $12.5M growth round in 2022 from
  existing investors including Aria Growth Partners and 25madison, and sells through national
  grocery, liquor retail and third-party beverage e-commerce alongside its own direct-to-consumer
  store. NO PUBLIC API SURFACE: Onda is a consumer packaged goods company, not a software vendor —
  there is no developer program, no API documentation, no SDK and no machine-readable contract of
  any kind. Its only owned web property, drinkonda.com, is a Shopify storefront that on 2026-08-26
  returned HTTP 404 "This store is unavailable" on every path probed, with a robots.txt that
  disallows all crawling and a Shopify-generated /llms.txt that states agent interaction is not
  possible; the last archived working capture of the storefront is 2026-02-18. Onda appears in the
  API Evangelist network because it trades on the private secondary market (EquityZen, Nasdaq
  Private Market), not because it publishes an API.
