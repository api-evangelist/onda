  http_status: 404
  hsts: true
  hsts_max_age: 7889238
  hsts_source: manual curl HEAD https://drinkonda.com/ 2026-08-26
  edge: cloudflare
  origin_platform: Shopify
domains:
- domain: drinkonda.com
  dnssec: false
  caa: []
  spf: true
  dmarc: true
  dmarc_policy: reject
