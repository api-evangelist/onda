note: >-
  Onda publishes no API, so the only host in scope is the company's own storefront domain
  drinkonda.com. The Shopify origin answers HTTP 404 "This store is unavailable" on every path
  (checked 2026-08-26); the automated probe records hsts as null because its HEAD request raised
  on that 404 before reading headers. A manual HEAD confirms the origin does send
  Strict-Transport-Security: max-age=7889238, so hsts is recorded as true with the observed
  max-age. Everything below is what was actually observed — an absent record (no CAA, no DNSSEC)
  is valid data, not a gap in the probe.
hosts:
